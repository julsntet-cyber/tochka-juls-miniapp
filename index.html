<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF1F1">
<title>Точка Джулс · мой день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Нежно-розовое стекло. Все кнопки полупрозрачные, чёрного нет.
   Вкладка «Практики» уходит в тёплый кремово-жёлтый. Шрифт Manrope. */
:root{
  --bg:#FAF1F1;
  --b1:#F9D5DE; --b2:#E9DCF3; --b3:#FDE3D5;
  --ink:#241C20;
  --text:#241C20;
  --text-2:#6F626A;
  --mute:#A0939A;
  --card:rgba(255,255,255,.58);
  --card-2:rgba(255,255,255,.4);
  --edge:rgba(255,255,255,.78);
  --line:rgba(36,28,32,.08);
  --acc:#E8899F;
  --acc-2:#F2AE9E;
  --acc-soft:rgba(232,137,159,.18);
  --acc-ink:#A14A63;
  --shadow:0 14px 34px rgba(170,110,130,.14);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font:500 16px/1.45 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .4s;
  padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));
}
.num{font-variant-numeric:tabular-nums}
.aura{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.78}
.blob.a{width:72vw;height:72vw;left:-24vw;top:-18vw;background:var(--b1)}
.blob.b{width:64vw;height:64vw;right:-24vw;top:24vh;background:var(--b3)}
.blob.c{width:78vw;height:78vw;left:-16vw;bottom:-24vh;background:var(--b2)}
.app{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
header.top{padding:calc(18px + env(safe-area-inset-top,0px)) 0 8px}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.date{color:var(--text-2);font-size:14px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--edge);
  border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-2);white-space:nowrap;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:block}
.chip.on i{background:var(--acc)}
h1{margin:10px 0 0;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
body[data-tab="today"] h1{font-size:27px;line-height:1.25;font-weight:700}
h1 small{display:block;font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:0;margin-top:6px}
h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--shadow);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3)}
@supports not (backdrop-filter:blur(2px)){.card{background:rgba(255,255,255,.9)}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch .r{font-size:13px;font-weight:700;color:var(--text-2)}
.muted{color:var(--text-2);font-size:13px;font-weight:600}
.mini{color:var(--mute);font-size:12px;font-weight:600;margin:10px 0 0}
.big{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1}
/* полупрозрачные кнопки вместо чёрных */
.pill{appearance:none;border:1px solid var(--edge);border-radius:99px;
  background:rgba(255,255,255,.6);color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font:800 14px/1 Manrope,sans-serif;padding:13px 20px;cursor:pointer;box-shadow:0 6px 16px rgba(170,110,130,.1)}
.pill.acc{background:linear-gradient(135deg,rgba(232,137,159,.42),rgba(242,174,158,.42));border-color:rgba(255,255,255,.7);color:var(--acc-ink)}
.pill:active{transform:scale(.97)}
.glassbtn{border:1px solid var(--edge);background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;cursor:pointer;font:inherit;color:inherit}
/* ---------- шапка Lock In ---------- */
.lock{background:linear-gradient(145deg,rgba(255,255,255,.66),rgba(249,213,222,.42))}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.ph{border:1px solid var(--edge);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-2);background:rgba(255,255,255,.45)}
.ph.on{background:linear-gradient(135deg,rgba(232,137,159,.4),rgba(242,174,158,.4));color:var(--acc-ink)}
.lock .row1{display:flex;align-items:flex-end;gap:10px;margin-top:16px}
.lock .row1 .sub{padding-bottom:7px;color:var(--text-2);font-size:14px;font-weight:700}
.tl{display:flex;gap:6px;margin-top:14px}
.tl div{flex:1;font-size:11px;font-weight:700;color:var(--mute)}
.tl i{display:block;height:6px;border-radius:6px;background:rgba(36,28,32,.08);margin-bottom:6px;overflow:hidden}
.tl i u{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-2));border-radius:6px}
.tl div.cur{color:var(--text)}
/* ---------- норма дня ---------- */
.norm{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:800;line-height:1}
.ring b span{font-size:10px;font-weight:700;color:var(--text-2);margin-top:3px}
.normlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nb{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.5);border:1px solid var(--edge);color:var(--text-2)}
.nb.on{background:var(--acc-soft);color:var(--acc-ink)}
.done{display:inline-flex;align-items:center;gap:7px;background:rgba(232,137,159,.2);color:var(--acc-ink);
  border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;margin-top:12px}
/* ---------- строки с отметкой ---------- */
.row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.46);border:1px solid var(--edge);
  border-radius:18px;padding:13px;margin-top:8px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row .box{width:26px;height:26px;border-radius:50%;border:1.6px solid rgba(36,28,32,.16);flex:none;display:flex;
  align-items:center;justify-content:center;background:rgba(255,255,255,.7);color:var(--acc-ink);padding:0;cursor:pointer}
.row.on .box{background:linear-gradient(135deg,var(--acc),var(--acc-2));border-color:transparent;color:#fff}
.row.on .t b{text-decoration:line-through;color:var(--mute)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:700}
.row .t>span{display:inline-block;font-size:12px;font-weight:600;color:var(--text-2);margin-top:3px}
.tag{display:inline-block;background:var(--acc-soft);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--acc-ink);margin-left:6px}
.go{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.66);border:1px solid var(--edge);
  color:var(--acc-ink);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sec{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 2px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;border:1px solid var(--edge);background:rgba(255,255,255,.55);border-radius:16px;
  padding:13px 15px;font:600 15px Manrope,sans-serif;color:var(--text)}
.addrow input::placeholder{color:var(--mute)}
.addrow input:focus{outline:2px solid var(--acc);outline-offset:0}
/* ---------- вода ---------- */
.wtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wtop b{font-size:40px;font-weight:300;letter-spacing:-.03em}
.glasses{display:flex;gap:8px;margin-top:14px}
.glass{flex:1;aspect-ratio:3/4;position:relative;border:0;background:none;padding:0;cursor:pointer}
.glass svg{width:100%;height:100%;display:block}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;background:rgba(255,255,255,.46);
  border:1px solid var(--edge);border-radius:16px;padding:11px 13px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.sw{width:44px;height:26px;border-radius:99px;background:rgba(36,28,32,.12);position:relative;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.toggle.on .sw{background:linear-gradient(135deg,var(--acc),var(--acc-2))}
.toggle.on .sw::after{transform:translateX(18px)}
.toggle .tt{display:block;font-size:14px;font-weight:700}
.toggle .tn{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-top:2px}
/* ---------- счётчик и плитки ---------- */
.counter{display:flex;gap:10px}
.cbox{flex:1;background:rgba(255,255,255,.5);border:1px solid var(--edge);border-radius:18px;padding:14px 12px;text-align:center}
.cbox b{display:block;font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1}
.cbox span{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-top:6px}
.two{display:flex;gap:10px;margin-top:12px}
.two .cbox{text-align:left;padding:13px}
.two .cbox b{font-size:26px}
/* ---------- картинка дня ---------- */
.vision img{display:block;width:100%;height:auto;border-radius:18px;background:rgba(255,255,255,.4)}
.vision .copy{margin-top:14px}
.vision p{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.vision .bridge{margin-top:8px;color:var(--text-2);font-size:14px;font-weight:600}
.vdots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.vdots i{width:7px;height:7px;border-radius:50%;background:rgba(36,28,32,.14)}
.vdots i.on{background:var(--acc);width:20px;border-radius:99px}
/* ---------- сон и стресс ---------- */
.hbars{display:flex;gap:7px;align-items:flex-end;height:112px;margin-top:6px}
.hbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.hbars i{display:block;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,var(--acc),var(--acc-2));min-height:6px;opacity:.9}
.hbars i.low{background:linear-gradient(180deg,rgba(200,175,215,.9),rgba(170,150,200,.85))}
.hbars span{text-align:center;font-size:11px;font-weight:700;color:var(--mute)}
.stress{display:flex;gap:7px;margin-top:10px}
.stress div{flex:1;text-align:center}
.stress i{display:block;height:34px;border-radius:10px;background:rgba(36,28,32,.06);position:relative;overflow:hidden}
.stress i u{position:absolute;left:0;right:0;bottom:0;display:block;border-radius:10px}
.stress s{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-top:4px;text-decoration:none}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:700;color:var(--text-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg b{width:12px;height:12px;border-radius:4px;display:block}
/* ---------- блог ---------- */
.gauge{position:relative;width:100%;max-width:320px;margin:6px auto 0}
.gauge svg{width:100%;display:block}
.gauge .c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .c b{display:block;font-size:46px;font-weight:300;letter-spacing:-.04em;line-height:1}
.gauge .c span{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-top:4px}
.marks{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);margin-top:2px}
.wbars{display:flex;gap:8px;align-items:flex-end;height:84px;margin-top:10px}
.wbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.wbars i{display:block;border-radius:9px 9px 4px 4px;background:rgba(232,137,159,.28);min-height:6px}
.wbars i.last{background:linear-gradient(180deg,var(--acc),var(--acc-2))}
.wbars span{text-align:center;font-size:11px;font-weight:700;color:var(--mute)}
.cp{background:rgba(255,255,255,.44);border:1px solid var(--edge);border-radius:18px;padding:13px;margin-top:8px}
.cp .l1{display:flex;align-items:center;gap:8px}
.cp .d{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;width:22px;flex:none}
.cp b{font-size:15px;font-weight:700;flex:1;min-width:0}
.cp .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 30px}
.cp .tg{font-size:11px;font-weight:700;border-radius:99px;padding:4px 9px;background:rgba(255,255,255,.6);border:1px solid var(--edge);color:var(--text-2)}
.cp .tg.t-vovlek{background:rgba(242,174,158,.3);color:#9C5A46}
.cp .tg.t-prodaz{background:rgba(232,137,159,.28);color:var(--acc-ink)}
.cp .tg.t-lichn{background:rgba(205,188,231,.36);color:#5E4E86}
.cp .tg.t-podpis{background:rgba(168,210,196,.36);color:#36695A}
.cp .marksrow{display:flex;gap:8px;margin:10px 0 0 30px}
.tog{flex:1;border:1px solid rgba(36,28,32,.1);background:rgba(255,255,255,.52);border-radius:14px;padding:9px;
  font:700 13px Manrope,sans-serif;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tog.on{background:linear-gradient(135deg,rgba(232,137,159,.36),rgba(242,174,158,.36));color:var(--acc-ink);border-color:rgba(255,255,255,.75)}
/* ---------- практики: тёплый кремово-жёлтый ---------- */
body[data-tab="practices"]{--bg:#FBF3DF;--b1:#FBE8B8;--b2:#F6EAD2;--b3:#FFF4DC;--acc:#E0B45F;--acc-2:#EFCB86;
  --acc-soft:rgba(224,180,95,.2);--acc-ink:#8A6520;--shadow:0 14px 34px rgba(170,140,70,.14)}
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin-top:14px;aspect-ratio:736/977;max-width:100%;
  border:1px solid var(--edge);box-shadow:var(--shadow);display:flex;align-items:flex-end}
.hero .ph{position:absolute;inset:0;background:
  radial-gradient(60% 55% at 22% 22%,rgba(255,255,255,.95),transparent 62%),
  radial-gradient(55% 50% at 82% 18%,rgba(255,232,196,.95),transparent 66%),
  radial-gradient(70% 60% at 70% 95%,rgba(246,205,214,.85),transparent 70%),
  linear-gradient(150deg,#FFF6E2,#FBE9C6 45%,#F7DCC8)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 45%,rgba(255,250,240,.72))}
.hero.photo .shade{background:linear-gradient(180deg,rgba(40,30,18,0) 48%,rgba(40,30,18,.42) 72%,rgba(40,30,18,.82))}
.hero .in{position:relative;padding:22px 20px 20px;color:var(--acc-ink);width:100%}
.hero.photo .in{color:#fff}
.hero .in .q{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.hero.photo .in .q{font-size:20px;text-shadow:0 2px 14px rgba(30,22,12,.6)}
.hero .in .w{font-size:13px;font-weight:700;opacity:.75;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tile{border:1px solid var(--edge);background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(251,232,184,.6));border-radius:22px;padding:15px;text-align:left;cursor:pointer;
  font:inherit;color:inherit;display:flex;flex-direction:column;gap:10px;min-height:130px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tile .ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.75);border:1px solid var(--edge);
  color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.tile b{font-size:15px;font-weight:800;line-height:1.2}
.tile .m{font-size:20px;font-weight:300;letter-spacing:-.02em;margin-top:auto}
.tile .m em{font-style:normal;font-size:12px;font-weight:700;color:var(--text-2);margin-left:4px}
.tile.on{background:linear-gradient(140deg,rgba(224,180,95,.45),rgba(255,247,222,.85))}
.tile.on .ic{background:rgba(255,255,255,.9)}
/* календарь тропы */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calw .dw{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font:700 13px Manrope,sans-serif;color:var(--text-2);cursor:default;padding:0}
.cd.off{opacity:.35}
.cd.on{background:linear-gradient(145deg,rgba(224,180,95,.45),rgba(239,203,134,.45));color:var(--acc-ink);border-color:rgba(255,255,255,.8)}
.cd.today{outline:2px solid var(--acc);outline-offset:1px;color:var(--text)}
.nowcard{display:flex;align-items:center;gap:14px;margin-top:12px;background:rgba(255,255,255,.6);
  border:1px solid var(--edge);border-radius:20px;padding:14px}
.nowcard .t{flex:1;min-width:0}
.nowcard .t b{display:block;font-size:16px;font-weight:800}
.nowcard .t span{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-top:3px}
/* ---------- мои дни ---------- */
.prog{display:flex;gap:10px;align-items:flex-end;height:124px;margin-top:4px;padding:0 4px}
.prog button{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
  background:none;border:0;padding:0;cursor:pointer}
.prog i{display:block;width:60%;margin:0 auto;border-radius:99px;background:rgba(255,255,255,.45);
  border:1px solid var(--edge);position:relative;overflow:hidden;flex:none}
.prog i u{position:absolute;left:0;right:0;bottom:0;display:block;border-radius:99px;
  background:linear-gradient(180deg,rgba(242,174,158,.75),rgba(232,137,159,.85))}
.prog i.full u{background:linear-gradient(180deg,rgba(217,167,200,.85),rgba(232,137,159,.95))}
.prog button.sel i{outline:1.5px solid var(--acc);outline-offset:3px}
.prog span{font-size:11px;font-weight:700;color:var(--mute)}
.prog button.sel span{color:var(--text)}
.weekcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.weekcal button{border:1px solid transparent;background:rgba(255,255,255,.34);border-radius:18px;padding:12px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:var(--text-2)}
.weekcal button.on{background:linear-gradient(145deg,rgba(232,137,159,.34),rgba(242,174,158,.34));color:var(--acc-ink)}
.weekcal .dw{font-size:10px;font-weight:700}
.weekcal .dn{font-size:16px;font-weight:800}
.weekcal i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block;opacity:0}
.weekcal i.has{opacity:1}
.slot{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.slot .hrs{width:54px;flex:none;font-size:12px;font-weight:700;color:var(--mute);padding-top:12px}
.slot .ev{flex:1;min-width:0;border:1px solid var(--edge);background:rgba(255,255,255,.44);border-radius:18px;padding:14px 16px}
.slot .ev b{display:block;font-size:14px;font-weight:800}
.slot .ev span{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-top:2px}

  var best=full>=5?'Неделя сложилась. Так и держим.'
    : full>=3?'Середина. Добери воду и медитации, и неделя закроется.'
    : 'Неделя просела. Начни с одного пункта нормы в день.';
  return '<section class="card'+(isToday?' lock':'')+'"><div class="ch"><h2>Итоги недели</h2>'
    + '<span class="chip'+(isToday?' on':'')+'">'+(isToday?'планёрка сегодня в '+pl.time:'планёрка '+(dd===1?'завтра':'через '+dd+' '+plural(dd,'день','дня','дней')))+'</span></div>'
    + '<div class="sum">'
    + '<div class="si"><b class="num">'+full+'<em> / 7</em></b><span>дней закрыто</span></div>'
    + '<div class="si"><b class="num">'+shot+'<em> / '+(b.plan||[]).length+'</em></b><span>роликов снято</span></div>'
    + '<div class="si"><b class="num">'+posted+'</b><span>выложено</span></div>'
    + '<div class="si"><b class="num">'+(gain>=0?'+':'')+gain+'</b><span>подписчиков</span></div>'
    + '<div class="si"><b class="num">'+meds+'</b><span>медитаций</span></div>'
    + '<div class="si"><b class="num">'+waterOk+'<em> / 7</em></b><span>дней с нормой воды</span></div>'
    + '</div><p class="muted" style="margin:14px 0 0">'+best+'</p></section>';
}
function viewDays(){
  var nt=normTotal(),wk=weekDays(),sel=S.sel&&wk.indexOf(S.sel)>=0?S.sel:todayStr();
  var full=0;
  wk.forEach(function(k){ if(normCount(S.days[k]||blankDay())>=nt) full++; });
  var h=top('Стратегия','как сложилась неделя')+banner();
  h+=weekSummary(wk,full,nt);
  h+='<section class="card"><div class="ch" style="margin-bottom:18px"><h2>Прогресс</h2><span class="r">'+full+' из 7 дней закрыто</span></div>'
    + '<div class="prog">'+wk.map(function(k){
        var d=S.days[k]||blankDay(),n=normCount(d),pc=clamp(Math.round(n/nt*100),6,100),fl=n>=nt;
        return '<button data-a="selDay" data-k="'+k+'" class="'+(k===sel?'sel':'')+'">'
          + '<i class="'+(fl?'full':'')+'" style="height:'+pc+'%"><u style="height:100%"></u></i>'
          + '<span>'+DW2[parse(k).getDay()]+'</span></button>'; }).join('')
    + '</div>'+(function(){
        var d=S.days[sel]||blankDay(),ns=normState(d),n=normCount(d);
        return '<div class="two"><div class="cbox"><b class="num">'+n+' из '+nt+'</b><span>'+(sel===todayStr()?'сегодня':longDate(sel))+'</span></div>'
          + '<div class="cbox"><b class="num">'+N(d.water)+'</b><span>мл воды</span></div></div>'
          + '<div class="normlist">'+(D.norm||[]).map(function(x){
              return '<span class="nb'+(ns[x.id]?' on':'')+'">'+(ns[x.id]?ico('check',11):'')+esc(x.title)+'</span>'; }).join('')+'</div>'
          + (n>=nt?'<div class="done">'+ico('check',14)+'День засчитан</div>':''); })()
    + '</section>';
  var ev=dayEvents(sel),dsel=S.days[sel]||blankDay();
  h+='<section class="card"><div class="ch"><h2>'+MN2[parse(sel).getMonth()].replace(/^./,function(c){ return c.toUpperCase(); })+'</h2>'
    + '<span class="r">'+shortDate(wk[0])+' – '+shortDate(wk[6])+'</span></div>'
    + '<div class="weekcal">'+wk.map(function(k){
        return '<button data-a="selDay" data-k="'+k+'" class="'+(k===sel?'on':'')+'">'
          + '<span class="dw">'+DW2[parse(k).getDay()]+'</span><span class="dn num">'+parse(k).getDate()+'</span>'
          + '<i class="'+(dayEvents(k).length?'has':'')+'"></i></button>'; }).join('')
    + '</div>'
    + (ev.length? ev.map(function(x){
        return '<div class="slot"><span class="hrs">'+esc(x.time||'днём')+'</span><span class="ev"><b>'+esc(x.title)+'</b><span>'+esc(x.note)+'</span></span></div>'; }).join('')
      : '<p class="muted" style="margin:14px 0 0">На этот день ничего не записано.</p>')
    + '</section>';
  var pays=(D.payments||[]).map(function(p){ return {p:p,n:nextDue(p)}; }).sort(function(a,b){ return a.n.days-b.n.days; });
  var soonN=pays.filter(function(x){ return x.n.days<=(x.p.remind||0)||x.n.days<=1; }).length;
  h+='<section class="card"><div class="ch"><h2>Оплаты и дедлайны</h2><span class="r num">'+soonN+' / '+pays.length+'</span></div>'
    + '<div class="tasklist">'+pays.map(function(x){
        var soon=x.n.days<=(x.p.remind||0)||x.n.days<=1;
        return '<div class="ti"><span class="ic">'+ico('cal',16)+'</span><span class="t"><b>'+esc(x.p.title)+'</b>'
          + '<span>'+(x.p.rule.type==='weekly'?'каждый '+DW[x.p.rule.dow]:'до '+x.n.date.getDate()+' '+MN[x.n.date.getMonth()])+' · '+dueText(x.n.days)+'</span></span>'
          + '<span class="dot'+(soon?' on':'')+'">'+(soon?ico('check',11):'')+'</span></div>'; }).join('')
    + '</div></section>';
  var mood=dsel.mood||'',me=(D.emotions.moods||[]).filter(function(x){ return x.id===mood; })[0];
  h+='<section class="card orbcard"><div class="ch"><h2>Дневник эмоций</h2>'
    + '<span class="r">'+((S.emotions||[]).length?S.emotions.length+' '+plural(S.emotions.length,'запись','записи','записей'):'пока пусто')+'</span></div>'
    + '<button class="emoorb" data-a="emoOpen">'+(me?esc(me.title):'Записать')+'<span>'+(me?'нажми, чтобы дописать':esc(D.emotions.question||'что чувствую сейчас'))+'</span></button>'
    + '<div class="elist">'+(S.emotions||[]).slice(0,5).map(function(e){
        var m=(D.emotions.moods||[]).filter(function(x){ return x.id===e.mood; })[0];
        return '<div class="eitem"><b>'+esc(m?m.title:'запись')+'</b>'+(e.note?'<p>'+esc(e.note)+'</p>':'')+'<span>'+longDate(e.date)+'</span></div>'; }).join('')
    + '</div></section>';
  return h;
}
function viewError(){
  return '<section class="card empty"><h2>Данные не загрузились</h2><p>'+esc(loadError||'Не удалось прочитать data.json.')
    + ' Проверь, что файл data.json лежит рядом с index.html, и открой приложение ещё раз.</p>'
    + '<button class="pill acc" data-a="retry">Повторить</button></section>';
}
/* ---------- сборка ---------- */
var TABS=[{k:'today',t:'Сегодня',i:'sun'},{k:'health',t:'Здоровье',i:'drop'},{k:'practices',t:'Практики',i:'lotus'},
          {k:'blog',t:'Блог',i:'chart'},{k:'days',t:'Стратегия',i:'cal'}];
function render(){
  var v=document.getElementById('view'),nav=document.getElementById('nav'),keep={};
  Array.prototype.forEach.call(v.querySelectorAll('[data-keep]'),function(el){ if(el.value) keep[el.id]=el.value; });
  document.body.dataset.tab=tab;
  v.innerHTML = !D ? viewError() : tab==='today'?viewToday() : tab==='health'?viewHealth() : tab==='practices'?viewPractices()
    : tab==='blog'?viewBlog() : viewDays();
  nav.innerHTML = TABS.map(function(x){
    return '<button class="'+(tab===x.k?'on':'')+'" data-a="tab" data-k="'+x.k+'">'+ico(x.i,20)+x.t+'</button>'; }).join('');
  Object.keys(keep).forEach(function(id){ var el=document.getElementById(id); if(el&&!el.value) el.value=keep[id]; });
  var arc=document.getElementById('normArc');
  if(arc) requestAnimationFrame(function(){ arc.style.transition='stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)'; arc.setAttribute('stroke-dashoffset',arc.dataset.off); });
  var g=document.getElementById('gArc');
  if(g) requestAnimationFrame(function(){ g.style.transition='stroke-dasharray .8s cubic-bezier(.4,0,.2,1)'; g.setAttribute('stroke-dasharray',g.dataset.pct+' 100'); });
}
/* ---------- шторка практики ---------- */
var A=null, timer=null, breath=null;
function closeSheet(){
  if(typeof REC!=='undefined'&&REC){ try{ REC.stop(); }catch(e){} REC=null; }
  if(A){ try{ A.pause(); }catch(e){} A=null; }
  if(timer){ clearInterval(timer); timer=null; }
  breath=null;
  document.getElementById('sheet').innerHTML='';
}
function mmss(s){ s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function openPractice(id){
  var p=(D.practices||[]).filter(function(x){ return x.id===id; })[0];
  if(!p) return;
  var d=day(), done=p.marks&&d[p.marks];
  var inner='<div class="grab"></div><h3>'+esc(p.title)+'</h3><div class="note">'+esc(p.note||'')+'</div>';
  if(p.kind==='audio'){
    inner+='<div class="player"><button class="playbtn" data-a="audio">'+ico('play',26)+'</button>'
      + '<div class="ptrack"><div class="pbar"><u id="pb"></u></div><div class="ptime"><span id="pt">0:00</span><span id="pd">'+(p.minutes?mmss(p.minutes*60):'--:--')+'</span></div></div></div>';
  } else if(p.kind==='vision'){
    var v=(D.visions||[])[vIdx%((D.visions||[]).length||1)];
    inner+=(p.src?'<div class="player"><button class="playbtn" data-a="audio">'+ico('play',26)+'</button>'
      + '<div class="ptrack"><div class="pbar"><u id="pb"></u></div><div class="ptime"><span id="pt">0:00</span><span id="pd">'+(p.minutes?mmss(p.minutes*60):'--:--')+'</span></div></div></div>':'')
      + '<div class="vision" style="margin-top:18px"><img src="'+esc(v.image)+'" alt=""><div class="copy"><p>'+esc(v.text)+'</p>'
      + '<div class="bridge">'+esc(v.bridge)+'</div></div></div>'
      + '<button class="pill ghost" style="width:100%;margin-top:14px" data-a="vision">Следующая картинка</button>';
  } else {
    var pats=p.patterns||[];
    breath={p:pats[0],step:0,left:pats[0].steps[0][1],round:1,on:false};
    inner+='<div class="pats">'+pats.map(function(x,i){
        return '<button class="pat'+(i===0?' on':'')+'" data-a="pattern" data-k="'+esc(x.id)+'">'+esc(x.name)+'</button>'; }).join('')+'</div>'
      + '<div class="orb" id="orb"></div><div class="orbl" id="orbl">'+esc(pats[0].steps[0][0])+' '+pats[0].steps[0][1]+'<span>Круг 1 из '+pats[0].rounds+'</span></div>'
      + '<button class="pill" style="width:100%;margin-top:18px" data-a="breath" id="breathBtn">Начать</button>';
  }
  inner+='<div class="sheetfoot">'+(p.marks?'<button class="pill'+(done?' ghost':'')+'" data-a="markSheet" data-k="'+esc(p.marks)+'">'+(done?'Отмечено сегодня':'Отметить пройденной')+'</button>':'')
    + '<button class="pill ghost" data-a="close">Закрыть</button></div>';
  document.getElementById('sheet').innerHTML='<div class="scrim" data-a="close"></div><div class="sheet" data-p="'+esc(p.id)+'">'+inner+'</div>';
  if(p.src){
    A=new Audio(p.src); A.preload='metadata';
    A.addEventListener('loadedmetadata',function(){ var e=document.getElementById('pd'); if(e&&isFinite(A.duration)) e.textContent=mmss(A.duration); });
    A.addEventListener('timeupdate',function(){
      var b=document.getElementById('pb'), t=document.getElementById('pt');
      if(b&&A.duration) b.style.width=(A.currentTime/A.duration*100)+'%';
      if(t) t.textContent=mmss(A.currentTime);
    });
    A.addEventListener('ended',function(){ var btn=document.querySelector('[data-a="audio"]'); if(btn) btn.innerHTML=ico('play',26); if(p.marks) setMark(p.marks,1); });
    A.addEventListener('error',function(){ var n=document.querySelector('.sheet .note'); if(n) n.textContent='Файл '+p.src+' не нашёлся. Проверь папку audio рядом с приложением.'; });
  }
}
function tickBreath(){
  if(!breath||!breath.on) return;
  breath.left--;
  if(breath.left<=0){
    breath.step++;
    if(breath.step>=breath.p.steps.length){ breath.step=0; breath.round++; }
    if(breath.round>breath.p.rounds){ stopBreath(true); return; }
    breath.left=breath.p.steps[breath.step][1];
  }
  paintBreath();
}
function paintBreath(){
  var o=document.getElementById('orb'), l=document.getElementById('orbl');
  if(!o||!l||!breath) return;
  var name=breath.p.steps[breath.step][0], len=breath.p.steps[breath.step][1];
  var big=name==='Вдох'?1:name==='Выдох'?.58:(breath.step>0&&breath.p.steps[breath.step-1][0]==='Вдох'?1:.58);
  o.style.transitionDuration=(breath.on?len:0)+'s';
  o.style.transform='scale('+big+')';
  l.innerHTML=esc(name)+' '+breath.left+'<span>Круг '+Math.min(breath.round,breath.p.rounds)+' из '+breath.p.rounds+'</span>';
}
function stopBreath(done){
  breath.on=false;
  if(timer){ clearInterval(timer); timer=null; }
  var b=document.getElementById('breathBtn'); if(b) b.textContent=done?'Пройдено, ещё раз':'Продолжить';
  var l=document.getElementById('orbl');
  if(done){ if(l) l.innerHTML='Готово<span>можно возвращаться в день</span>'; setMark('breath',1); breath.round=1; breath.step=0; breath.left=breath.p.steps[0][1]; }
}
function setMark(k,v){
  var d=day(); d[k]=v!=null?v:(d[k]?0:1); save(); render(); syncPush();
}

function openEmotions(){
  var d=day();
  var inner='<div class="grab"></div><h3>Дневник эмоций</h3><div class="note">'+esc(D.emotions.question||'что чувствую сейчас')+'</div>'
    + '<div class="moods">'+(D.emotions.moods||[]).map(function(m){
        return '<button class="mood'+(d.mood===m.id?' on':'')+'" data-a="emoPick" data-k="'+esc(m.id)+'">'+esc(m.title)+'</button>'; }).join('')+'</div>'
    + '<textarea id="emoText" placeholder="Пара слов, если хочется">'+esc(d.note||'')+'</textarea>'
    + '<button class="voicebtn" data-a="voice"><span class="pulse"></span><span class="lbl">Записать голосом</span></button>'
    + '<p class="mini" id="voiceNote">Голос превращается в текст прямо здесь.</p>'
    + '<div class="sheetfoot"><button class="pill acc" data-a="emoWrite">Записать</button>'
    + '<button class="pill" data-a="close">Закрыть</button></div>';
  document.getElementById('sheet').innerHTML='<div class="scrim" data-a="close"></div><div class="sheet">'+inner+'</div>';
}
/* ---------- действия ---------- */
var REC=null;
var ACTIONS={
  tab:function(k){ if(k===tab) return; tab=k; closeSheet(); window.scrollTo(0,0); render(); haptic('light'); },
  water:function(k){ var d=day(), n=+k, gl=D.water.glassMl; var cur=Math.round(d.water/gl);
    d.water=(n===cur? n-1 : n)*gl; if(d.water<0) d.water=0; save(); render(); haptic('light'); syncPush(); },
  training:function(){ var d=day(); d.training=d.training?0:1; save(); render(); syncPush(); },
  supp:function(k){ setMark(k); haptic('light'); },
  mark:function(k){ setMark(k); haptic('light'); },
  markSheet:function(k){ var d=day(); d[k]=d[k]?0:1; save(); syncPush();
    var b=document.querySelector('[data-a="markSheet"]');
    if(b){ b.textContent=d[k]?'Отмечено сегодня':'Отметить пройденной'; b.className='pill'+(d[k]?' ghost':''); } haptic('medium'); },
  task:function(k){ var d=day(); d.tasks[k]=d.tasks[k]?0:1; save(); render(); haptic('light'); syncPush(); },
  taskAdd:function(){ var el=document.getElementById('taskIn'); if(!el||!el.value.trim()) return;
    S.extraTasks.push({id:'x'+Date.now(),title:el.value.trim(),time:'',tag:''}); el.value=''; save(); render(); syncPush(); },
  vision:function(){ vIdx=(vIdx+1)%((D.visions||[]).length||1); var d=day(); d.visual=1; save();
    if(document.querySelector('.sheet')) openPractice('visual'); else render(); syncPush(); },
  cp:function(k){ var p=k.split('|'), s=S.content[p[0]]||(S.content[p[0]]={}); s[p[1]]=s[p[1]]?0:1; save(); render(); haptic('light'); syncPush(); },
  followers:function(){ var el=document.getElementById('fIn'); if(!el) return;
    var n=parseInt(String(el.value).replace(/\D/g,''),10); if(!n) return;
    S.followers=n; el.value=''; save(); render(); syncPush(); },
  selDay:function(k){ S.sel=k; save(); render(); haptic('light'); },
  pathDay:function(k){ if(parse(k)>parse(todayStr())) return; var d=day(k); d.path=d.path?0:1; save(); render(); haptic('light'); },
  emoOpen:function(){ openEmotions(); haptic('light'); },
  emoPick:function(k){ var d=day(); d.mood=d.mood===k?'':k; save();
    Array.prototype.forEach.call(document.querySelectorAll('.sheet .mood'),function(el){ el.classList.toggle('on',el.dataset.k===d.mood); }); },
  emoWrite:function(){ var el=document.getElementById('emoText'), d=day();
    if(!d.mood&&!(el&&el.value.trim())) { closeSheet(); return; }
    d.note=el?el.value.trim():'';
    S.emotions=(S.emotions||[]).filter(function(e){ return e.date!==todayStr(); });
    S.emotions.unshift({date:todayStr(),mood:d.mood,note:d.note});
    save(); closeSheet(); render(); haptic('medium'); },
  ideas:function(){ S.ideasOpen=!S.ideasOpen; save(); render(); haptic('light'); },
  ideaAdd:function(){ var el=document.getElementById('ideaIn'); if(!el||!el.value.trim()) return;
    if(!S.ideas||!S.ideas.length) S.ideas=(D.blog.ideas||[]).slice();
    S.ideas.unshift({id:'i'+Date.now(),text:el.value.trim(),tag:''});
    el.value=''; S.ideasOpen=true; save(); render(); syncPush(); },
  voice:function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition, el=document.getElementById('emoText'),
        btn=document.querySelector('.voicebtn'), note=document.getElementById('voiceNote');
    if(!SR){ if(note) note.textContent='Диктовка не работает в этом приложении. Надиктуй боту в Телеграме, он положит запись сюда.'; return; }
    if(REC){ REC.stop(); return; }
    REC=new SR(); REC.lang='ru-RU'; REC.interimResults=true; REC.continuous=true;
    var base=el?el.value:'';
    REC.onresult=function(ev){
      var txt='';
      for(var i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
      if(el) el.value=(base?base+' ':'')+txt;
    };
    REC.onerror=function(){ if(note) note.textContent='Микрофон не дал доступ. Можно написать текстом.'; };
    REC.onend=function(){ REC=null; if(btn){ btn.classList.remove('rec'); btn.querySelector('span.lbl').textContent='Записать голосом'; } };
    try{ REC.start(); if(btn){ btn.classList.add('rec'); btn.querySelector('span.lbl').textContent='Идёт запись, нажми чтобы остановить'; } }
    catch(e){ REC=null; }
  },
  openPractice:function(k){ openPractice(k); haptic('light'); },
  audio:function(){ if(!A) return; var b=document.querySelector('[data-a="audio"]');
    if(A.paused){ A.play().then(function(){ if(b) b.innerHTML=ico('pause',26); }).catch(function(){
      var n=document.querySelector('.sheet .note'); if(n) n.textContent='Не получилось включить звук. Нажми ещё раз.'; });
    } else { A.pause(); if(b) b.innerHTML=ico('play',26); } },
  pattern:function(k){ var p=(D.practices||[]).filter(function(x){ return x.kind==='breath'; })[0];
    var pat=(p.patterns||[]).filter(function(x){ return x.id===k; })[0]; if(!pat) return;
    if(timer){ clearInterval(timer); timer=null; }
    breath={p:pat,step:0,left:pat.steps[0][1],round:1,on:false};
    Array.prototype.forEach.call(document.querySelectorAll('.pat'),function(el){ el.classList.toggle('on',el.dataset.k===k); });
    var b=document.getElementById('breathBtn'); if(b) b.textContent='Начать';
    paintBreath(); },
  breath:function(){ if(!breath) return;
    if(breath.on){ stopBreath(false); return; }
    breath.on=true; var b=document.getElementById('breathBtn'); if(b) b.textContent='Пауза';
    paintBreath(); if(timer) clearInterval(timer); timer=setInterval(tickBreath,1000); haptic('light'); },
  close:function(){ closeSheet(); render(); },
  reset:function(){ S={days:{},content:{},emotions:[],followers:null,extraTasks:[],sel:'',ideas:[],ideasOpen:false}; save(); seedDemo(); render(); },
  retry:function(){ boot(); }
};
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el) return;
  var fn=ACTIONS[el.dataset.a]; if(!fn) return;
  ev.preventDefault(); fn(el.dataset.k);
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&document.getElementById('sheet').innerHTML) ACTIONS.close();
  if(ev.key==='Enter'&&ev.target){
    if(ev.target.id==='taskIn') ACTIONS.taskAdd();
    if(ev.target.id==='fIn') ACTIONS.followers();
    if(ev.target.id==='ideaIn') ACTIONS.ideaAdd();
  }
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&D&&!document.getElementById('sheet').innerHTML){ syncPull().then(render); }
});
/* ---------- запуск ---------- */
function boot(){
  loadError='';
  fetch('data.json?v='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('data.json: ответ '+r.status+'.'); return r.json(); })
    .then(function(j){ D=j; S=loadState(); seedDemo(); render(); if(syncOn()) syncPull().then(render); })
    .catch(function(e){ D=null; loadError=(e&&e.message)?e.message:'Не удалось прочитать data.json.'; render(); });
}
render();
boot();
})();
</script>
