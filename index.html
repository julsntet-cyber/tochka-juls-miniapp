<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F8F4F1">
<title>Агент Юли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#E9E6E3}
sc-for,sc-if{display:contents}
#stage{position:fixed;top:0;left:50%;width:390px;height:100vh;transform:translateX(-50%);transform-origin:50% 0;overflow:hidden;background:#F8F4F1;-webkit-tap-highlight-color:transparent}
#stage[data-screen="health"]{background:#F5F6EE}
#stage[data-screen="strategy"]{background:#E6E5E4}
#scroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
#navslot{position:absolute;left:0;right:0;bottom:0;z-index:5}
#navslot nav{padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px)) !important}
.screen-root>main{padding-bottom:132px !important}
@media (min-width:521px){#stage{box-shadow:0 30px 80px -30px rgba(40,30,40,.35)}}
/* today */
@keyframes kRise_today{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes kFocusIn_today{from{opacity:0;filter:blur(14px);transform:translateY(8px)}}
@keyframes kTwinkle_today{from{opacity:.35}to{opacity:.95}}
[data-screen="today"] .k-rise{animation:kRise_today .56s ease-out both}
[data-screen="today"] .k-focus{animation:kFocusIn_today 1s ease-out both}
[data-screen="today"] .k-bokeh{animation:kTwinkle_today 5.5s ease-in-out infinite alternate}
[data-screen="today"] .k-press{transition:transform .16s ease-out,box-shadow .2s ease-out,background-color .2s ease-out}
[data-screen="today"] .k-press:active{transform:scale(.97)}
[data-screen="today"] .k-press:focus-visible{outline:2px solid #9E3F63;outline-offset:3px}
[data-screen="today"] .k-tab:hover{background-color:rgba(255,255,255,.45)}
@media (prefers-reduced-motion: reduce){
[data-screen="today"] .k-rise,[data-screen="today"] .k-focus,[data-screen="today"] .k-bokeh{animation:none!important}
[data-screen="today"] .k-press{transition:none}
[data-screen="today"] .k-press:active{transform:none}
}
/* practices */
@keyframes kRise_practices{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes kFocusIn_practices{from{opacity:0;filter:blur(14px);transform:translateY(8px)}}
@keyframes kTwinkle_practices{from{opacity:.35}to{opacity:.95}}
@keyframes kBreathe_practices{0%,100%{transform:scale(.84)}50%{transform:scale(1.06)}}
@keyframes kWave_practices{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
[data-screen="practices"] .k-rise{animation:kRise_practices .56s ease-out both}
[data-screen="practices"] .k-focus{animation:kFocusIn_practices 1s ease-out both}
[data-screen="practices"] .k-bokeh{animation:kTwinkle_practices 5.5s ease-in-out infinite alternate}
[data-screen="practices"] .k-breathe{animation:kBreathe_practices 8s ease-in-out infinite}
[data-screen="practices"] .k-wave.is-playing span{animation:kWave_practices .8s ease-in-out infinite alternate;transform-origin:50% 50%}
[data-screen="practices"] .k-press{transition:transform .16s ease-out,box-shadow .2s ease-out,background-color .2s ease-out}
[data-screen="practices"] .k-press:active{transform:scale(.97)}
[data-screen="practices"] .k-press:focus-visible{outline:2px solid #9E3F63;outline-offset:3px}
[data-screen="practices"] .k-tab:hover{background-color:rgba(255,255,255,.45)}
@media (prefers-reduced-motion: reduce){
[data-screen="practices"] .k-rise,[data-screen="practices"] .k-focus,[data-screen="practices"] .k-bokeh,[data-screen="practices"] .k-breathe,[data-screen="practices"] .k-wave.is-playing span{animation:none!important}
[data-screen="practices"] .k-press{transition:none}
[data-screen="practices"] .k-press:active{transform:none}
}
/* health */
@keyframes kRise_health{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes kFocusIn_health{from{opacity:0;filter:blur(14px);transform:translateY(8px)}}
@keyframes kTwinkle_health{from{opacity:.35}to{opacity:.95}}
@keyframes kDrift_health{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes kDriftBack_health{from{transform:translateX(-60px)}to{transform:translateX(0)}}
[data-screen="health"] .k-rise{animation:kRise_health .56s ease-out both}
[data-screen="health"] .k-focus{animation:kFocusIn_health 1s ease-out both}
[data-screen="health"] .k-bokeh{animation:kTwinkle_health 5.5s ease-in-out infinite alternate}
[data-screen="health"] .k-drift{animation:kDrift_health 5s linear infinite}
[data-screen="health"] .k-drift-back{animation:kDriftBack_health 9s linear infinite}
[data-screen="health"] .k-press{transition:transform .16s ease-out,box-shadow .2s ease-out,background-color .2s ease-out}
[data-screen="health"] .k-press:active{transform:scale(.97)}
[data-screen="health"] .k-press:focus-visible{outline:2px solid #55642F;outline-offset:3px}
[data-screen="health"] .k-tab:hover{background-color:rgba(255,255,255,.45)}
@media (prefers-reduced-motion: reduce){
[data-screen="health"] .k-rise,[data-screen="health"] .k-focus,[data-screen="health"] .k-bokeh,[data-screen="health"] .k-drift,[data-screen="health"] .k-drift-back{animation:none!important}
[data-screen="health"] .k-press{transition:none}
[data-screen="health"] .k-press:active{transform:none}
}
/* strategy */
@keyframes kRise_strategy{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes kFocusIn_strategy{from{opacity:0;filter:blur(12px);transform:translateY(6px)}}
@keyframes kDrift_strategy{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-18px,14px,0) scale(1.06)}}
@keyframes kDraw_strategy{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes kPop_strategy{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes kFade_strategy{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes kPulse_strategy{0%,100%{box-shadow:0 0 0 2px rgba(20,20,20,.55),0 0 0 2px rgba(212,242,58,.6)}50%{box-shadow:0 0 0 2px rgba(20,20,20,.55),0 0 0 8px rgba(212,242,58,0)}}
[data-screen="strategy"] .k-rise{animation:kRise_strategy .6s cubic-bezier(.2,.7,.2,1) backwards}
[data-screen="strategy"] .k-focus{animation:kFocusIn_strategy .9s ease-out both}
[data-screen="strategy"] .k-drift{animation:kDrift_strategy 11s ease-in-out infinite alternate}
[data-screen="strategy"] .k-draw{stroke-dasharray:1;animation:kDraw_strategy 1.3s cubic-bezier(.45,0,.2,1) .45s both}
[data-screen="strategy"] .k-pop{animation:kPop_strategy .45s cubic-bezier(.3,1.4,.5,1) both}
[data-screen="strategy"] .k-fade{animation:kFade_strategy .5s ease-out 1.2s both}
[data-screen="strategy"] .k-pulse{animation:kPulse_strategy 2.4s ease-in-out infinite}
[data-screen="strategy"] .k-press{transition:transform .16s ease-out,background-color .2s ease-out,box-shadow .2s ease-out}
[data-screen="strategy"] .k-press:active{transform:scale(.96)}
[data-screen="strategy"] .k-press:focus-visible{outline:2px solid #141414;outline-offset:3px}
[data-screen="strategy"] .k-tab:hover{background-color:rgba(255,255,255,.7)}
[data-screen="strategy"] .k-card{transition:transform .28s ease-out,box-shadow .28s ease-out}
[data-screen="strategy"] .k-card:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 24px 40px -24px rgba(40,40,55,.24)}
[data-screen="strategy"] .k-arrow{transition:transform .2s ease-out}
[data-screen="strategy"] .k-card:hover .k-arrow{transform:rotate(45deg)}
[data-screen="strategy"] .g-olive{background:linear-gradient(35deg,#3A4415 0%,#55651F 40%,#98AE36 78%,#CDE04E 100%)}
[data-screen="strategy"] .g-coral{background:linear-gradient(35deg,#7A4643 0%,#93605A 40%,#C99A86 76%,#EAC9B3 100%)}
[data-screen="strategy"] .g-brown{background:linear-gradient(160deg,#47301F 0%,#6B4C31 38%,#82773A 78%,#9A9A42 100%)}
[data-screen="strategy"] .g-glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(18px)}
@media (prefers-reduced-motion: reduce){
[data-screen="strategy"] .k-rise,[data-screen="strategy"] .k-focus,[data-screen="strategy"] .k-drift,[data-screen="strategy"] .k-draw,[data-screen="strategy"] .k-pop,[data-screen="strategy"] .k-fade,[data-screen="strategy"] .k-pulse{animation:none!important}
[data-screen="strategy"] .k-draw{stroke-dasharray:none}
[data-screen="strategy"] .k-press,[data-screen="strategy"] .k-card,[data-screen="strategy"] .k-arrow{transition:none}
[data-screen="strategy"] .k-press:active,[data-screen="strategy"] .k-card:hover,[data-screen="strategy"] .k-card:hover .k-arrow{transform:none}
}
</style>
</head>
<body>
<div id="stage"><div id="scroller"></div><div id="navslot"></div></div>

<template id="tpl-today">
<div style="width: 390px; min-height: var(--stage-h, 100vh); position: relative; overflow: hidden; box-sizing: border-box; background: #F8F4F1; color: #3B1F33; font-family: 'Onest', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;">
    <svg viewBox="-150 -150 300 300" style="position: absolute; left: 118px; top: -44px; width: 350px; height: 350px; filter: blur(36px); opacity: 0.92;">
      <g fill="{{ aura }}">
        <ellipse cx="0" cy="-60" rx="38" ry="64" opacity="0.95"></ellipse>
        <ellipse cx="0" cy="-60" rx="38" ry="64" opacity="0.7" transform="rotate(60)"></ellipse>
        <ellipse cx="0" cy="-60" rx="38" ry="64" opacity="0.95" transform="rotate(120)"></ellipse>
        <ellipse cx="0" cy="-60" rx="38" ry="64" opacity="0.7" transform="rotate(180)"></ellipse>
        <ellipse cx="0" cy="-60" rx="38" ry="64" opacity="0.95" transform="rotate(240)"></ellipse>
        <ellipse cx="0" cy="-60" rx="38" ry="64" opacity="0.7" transform="rotate(300)"></ellipse>
      </g>
      <circle cx="0" cy="0" r="30" fill="#F7DCCB"></circle>
    </svg>
    <svg viewBox="-150 -150 300 300" style="position: absolute; left: -160px; top: 500px; width: 350px; height: 350px; filter: blur(42px); opacity: 0.5;">
      <g fill="#C77399">
        <ellipse cx="0" cy="-58" rx="34" ry="62"></ellipse>
        <ellipse cx="0" cy="-58" rx="34" ry="62" transform="rotate(72)"></ellipse>
        <ellipse cx="0" cy="-58" rx="34" ry="62" transform="rotate(144)"></ellipse>
        <ellipse cx="0" cy="-58" rx="34" ry="62" transform="rotate(216)"></ellipse>
        <ellipse cx="0" cy="-58" rx="34" ry="62" transform="rotate(288)"></ellipse>
      </g>
      <circle cx="0" cy="0" r="26" fill="#EBC3D3"></circle>
    </svg>
    <svg viewBox="-150 -150 300 300" style="position: absolute; left: 150px; top: 900px; width: 340px; height: 340px; filter: blur(38px); opacity: 0.72;">
      <g fill="#B9A5E2">
        <ellipse cx="0" cy="-58" rx="36" ry="60"></ellipse>
        <ellipse cx="0" cy="-58" rx="36" ry="60" transform="rotate(60)"></ellipse>
        <ellipse cx="0" cy="-58" rx="36" ry="60" transform="rotate(120)"></ellipse>
        <ellipse cx="0" cy="-58" rx="36" ry="60" transform="rotate(180)"></ellipse>
        <ellipse cx="0" cy="-58" rx="36" ry="60" transform="rotate(240)"></ellipse>
        <ellipse cx="0" cy="-58" rx="36" ry="60" transform="rotate(300)"></ellipse>
      </g>
      <circle cx="0" cy="0" r="28" fill="#EAD9F0"></circle>
    </svg>
    <div class="k-bokeh" style="position: absolute; left: 300px; top: 330px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.85); filter: blur(6px); animation-delay: 0ms;"></div>
    <div class="k-bokeh" style="position: absolute; left: 36px; top: 110px; width: 14px; height: 14px; border-radius: 50%; background: rgba(227,163,187,0.7); filter: blur(3px); animation-delay: 900ms;"></div>
    <div class="k-bokeh" style="position: absolute; left: 252px; top: 640px; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.9); filter: blur(4px); animation-delay: 1800ms;"></div>
    <div class="k-bokeh" style="position: absolute; left: 18px; top: 860px; width: 44px; height: 44px; border-radius: 50%; background: rgba(201,184,236,0.55); filter: blur(10px); animation-delay: 600ms;"></div>
    <div class="k-bokeh" style="position: absolute; left: 330px; top: 1080px; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.9); filter: blur(3px); animation-delay: 2400ms;"></div>
    <div class="k-bokeh" style="position: absolute; left: 196px; top: 210px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.95); filter: blur(2px); animation-delay: 1300ms;"></div>
  </div>

  <main style="position: relative; z-index: 1; box-sizing: border-box; padding: 64px 20px 0;">

    <header style="height: 244px;">
      <p class="k-rise" style="margin: 0; height: 20px; font-size: 14px; line-height: 20px; font-weight: 500; color: #444F61; font-variant-numeric: tabular-nums;">{{ dateLabel }}</p>
      <h1 aria-label="{{ greetAria }}" style="margin: 12px 0 0; font-size: 54px; line-height: 0.94; font-weight: 800; letter-spacing: -0.035em; color: #3B1F33;">
        <span class="k-focus" aria-hidden="true" style="display: block; filter: blur(2px); opacity: 0.84; animation-delay: 40ms;">{{ greet1 }}</span>
        <span class="k-focus" aria-hidden="true" style="display: block; filter: blur(1.2px); opacity: 0.92; animation-delay: 160ms;">{{ greet2 }}</span>
        <span class="k-focus" aria-hidden="true" style="display: block; animation-delay: 280ms;">{{ userName }}</span>
      </h1>
      
    </header>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">

      <section class="k-rise" aria-labelledby="lockin-h" style="position: relative; box-sizing: border-box; height: 292px; padding: 20px; border-radius: 28px; background: rgba(255,255,255,0.48); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); border: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,0.65), 0 18px 40px -20px rgba(110,52,84,0.2); animation-delay: 420ms;">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 20px;">
          <h2 id="lockin-h" style="margin: 0; font-size: 16px; line-height: 20px; font-weight: 700; letter-spacing: -0.01em;">Lock In</h2>
          <span style="font-size: 13px; line-height: 20px; font-weight: 500; color: #444F61; font-variant-numeric: tabular-nums;">неделя {{ week }}</span>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; height: 72px; margin-top: 12px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 72px; line-height: 72px; font-weight: 800; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; color: #3B1F33;">{{ lockDay }}</span>
            <span style="display: flex; flex-direction: column; padding-top: 6px;">
              <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #444F61;">день</span>
              <span style="font-size: 18px; line-height: 22px; font-weight: 700; color: #3B1F33; font-variant-numeric: tabular-nums;">из {{ lockTotal }}</span>
            </span>
          </div>
          <div role="img" aria-label="{{ ringAria }}" style="position: relative; width: 72px; height: 72px;">
            <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
              <defs>
                <linearGradient id="kRing" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="{{ accent }}"></stop>
                  <stop offset="1" stop-color="#B79AD9"></stop>
                </linearGradient>
              </defs>
              <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(59,31,51,0.1)" stroke-width="6"></circle>
              <circle cx="36" cy="36" r="30" fill="none" stroke="url(#kRing)" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{ ringDash }}" transform="rotate(-90 36 36)"></circle>
            </svg>
            <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #3B1F33; font-variant-numeric: tabular-nums;">{{ lockPct }}%</span>
          </div>
        </div>

        <div style="display: flex; gap: 6px; height: 30px; margin-top: 16px;">
          <sc-for list="{{ phases }}" as="ph">
            <div style="{{ ph.wrapStyle }}">
              <div role="img" aria-label="{{ ph.aria }}" style="height: 6px; border-radius: 3px; background: rgba(59,31,51,0.1); overflow: hidden;">
                <div style="{{ ph.fillStyle }}"></div>
              </div>
              <div style="{{ ph.labelStyle }}">{{ ph.label }}</div>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; gap: 12px; box-sizing: border-box; height: 84px; margin-top: 16px; padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,0.5);">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #444F61;">Фокус фазы</div>
            <div style="margin-top: 4px; font-size: 15px; line-height: 20px; font-weight: 600; color: #3B1F33; text-wrap: pretty;">{{ focus }}</div>
          </div>
          <div style="width: 92px; text-align: right;">
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #444F61;">Цель</div>
            <div style="margin-top: 2px; font-size: 22px; line-height: 26px; font-weight: 800; letter-spacing: -0.02em; color: #3B1F33; font-variant-numeric: tabular-nums;">{{ goalValue }}</div>
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #444F61;">{{ goalLabel }}</div>
          </div>
        </div>
      </section>

      <section class="k-rise" aria-labelledby="main-h" style="position: relative; box-sizing: border-box; height: 202px; padding: 20px; border-radius: 28px; background: linear-gradient(150deg, rgba(255,255,255,0.68) 0%, rgba(248,220,231,0.56) 100%); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 22px 44px -22px rgba(158,63,99,0.28); overflow: hidden; animation-delay: 480ms;">
        <svg aria-hidden="true" width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#9E3F63" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: -8px; bottom: -10px; opacity: 0.16;">
          <rect x="3" y="6.5" width="13" height="11" rx="3"></rect>
          <path d="M16 10.5l5-3v9l-5-3"></path>
        </svg>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 26px;">
          <h2 id="main-h" style="margin: 0; font-size: 16px; line-height: 20px; font-weight: 700; letter-spacing: -0.01em;">Главное сегодня</h2>
          <span style="{{ chipStyle }}">{{ mainTag }}</span>
        </div>
        <div style="{{ timeStyle }}">{{ mainTime }}</div>
        <p style="{{ mainTitleStyle }}">{{ mainTitle }}</p>
        <sc-if value="{{ noMain }}">
          <p style="margin: 8px 0 0; max-width: 250px; font-size: 14px; line-height: 20px; color: #6B5563; text-wrap: pretty;">Скажи Агенту Юли голосом, что сегодня главное, и задача появится здесь.</p>
        </sc-if>
        <sc-if value="{{ hasMain }}">
        <button type="button" class="k-press" onClick="{{ toggleMain }}" aria-pressed="{{ mainPressed }}" style="{{ ctaStyle }}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.2 4.2L19 7"></path>
          </svg>
          <span>{{ ctaLabel }}</span>
        </button>
        </sc-if>
      </section>

      <section class="k-rise" aria-labelledby="rest-h" style="position: relative; box-sizing: border-box; min-height: 190px; padding: 20px; border-radius: 28px; background: rgba(255,255,255,0.46); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); border: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,0.65), 0 18px 40px -20px rgba(110,52,84,0.18); animation-delay: 540ms;">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 20px;">
          <h2 id="rest-h" style="margin: 0; font-size: 16px; line-height: 20px; font-weight: 700; letter-spacing: -0.01em;">Остальное</h2>
          <span style="font-size: 13px; line-height: 20px; font-weight: 500; color: #444F61; font-variant-numeric: tabular-nums;">{{ othersCount }}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;">
          <sc-for list="{{ tasks }}" as="item" hint-placeholder-count="2">
            <button type="button" class="k-press" onClick="{{ item.toggle }}" aria-pressed="{{ item.pressed }}" style="display: flex; align-items: center; gap: 14px; width: 100%; height: 58px; padding: 0; border: 0; border-radius: 16px; background: none; text-align: left; font-family: inherit; color: inherit; cursor: pointer;">
              <span style="{{ item.boxStyle }}">
                <sc-if value="{{ item.done }}" hint-placeholder-val="{{ true }}">

<script>
'use strict';
/* Кэшик — прототип мини-аппа, направление A «Розовый туман».

   Как устроено:
   - Экраны лежат выше в <template id="tpl-…">. В разметке дырки {{ имя }},
     <sc-for list="{{ список }}" as="x"> повторяет кусок, <sc-if value="{{ флаг }}"> показывает по условию,
     onclick="{{ функция }}" — обработчик нажатия.
   - Значения для дырок отдаёт renderVals() класса экрана (ниже). Состояние — this.state, меняется через setState.
   - Все данные берутся из data.json рядом с файлом. Если его не прочитать (файл открыт двойным кликом),
     используется встроенная копия из <script id="data-fallback">. */

let DATA = null;

const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const DAY_LABELS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const DAY = 864e5;

const ICONS = {
  dumbbell: 'M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11',
  lotus: 'M12 20c-4 0-7-2.5-8-6 2.5 0 5 1 6.5 3M12 20c4 0 7-2.5 8-6-2.5 0-5 1-6.5 3M12 20c-2-2-3-4.5-3-7s1.3-4.6 3-6c1.7 1.4 3 3.5 3 6s-1 5-3 7z',
  eye: 'M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z',
  face: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8M9 10h.01M15 10h.01',
  drop: 'M12 3.5s-6 6.6-6 11a6 6 0 0 0 12 0c0-4.4-6-11-6-11z',
  moon: 'M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z',
  capsule: 'M4.9 13.4l8.5-8.5a3.5 3.5 0 0 1 4.95 4.95l-8.5 8.5a3.5 3.5 0 0 1-4.95-4.95zM9.2 9.1l4.95 4.95',
  tablet: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM6.4 17.6L17.6 6.4'
};

// ---------- даты ----------
const noon = (s) => new Date(s + 'T12:00:00');
function today() {
  const d = DATA.date ? noon(DATA.date) : new Date();
  d.setHours(12, 0, 0, 0);
  return d;
}
const daysSince = (start) => Math.round((today() - noon(start)) / DAY);

// Тропа медитаций: круги по 66 дней, на каждый круг своя утренняя медитация
function trail() {
  const t = DATA.trail;
  const passed = Math.max(0, daysSince(t.start));
  const medIdx = Math.floor(passed / t.length) % t.meditations.length;
  return { day: passed % t.length + 1, length: t.length, medIdx, med: t.meditations[medIdx], count: t.meditations.length };
}

function lockIn() {
  const L = DATA.lockIn;
  const day = Math.min(L.total, Math.max(1, daysSince(L.start) + 1));
  return { ...L, day, week: Math.ceil(day / 7), pct: Math.round(day / L.total * 100) };
}

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const shift = (d, n) => new Date(d.getTime() + n * DAY);

// ---------- отметки дня ----------
// Галочки живут на сервере (kashik-api, /api/marks): их видит Кэшик и может ставить сам,
// например «сделала» голосом → задача зачёркивается. Копия лежит в телефоне, чтобы экран открывался сразу.
// Ключ синхронизации приходит в ссылке кнопки «Мой день» (#k=…) и запоминается.
const STORE = {
  key: '',
  date: '',
  day: {},
  days: {},

  init() {
    this.date = iso(today());
    const m = location.hash.match(/k=([^&]+)/);
    try {
      if (m) localStorage.setItem('kashik-key', decodeURIComponent(m[1]));
      this.key = localStorage.getItem('kashik-key') || '';
      this.day = JSON.parse(localStorage.getItem('kashik-day-' + this.date) || '{}');
      this.days = JSON.parse(localStorage.getItem('kashik-days') || '{}');
    } catch (e) { /* хранилище недоступно: работаем только с сервером */ }
    if (m) history.replaceState(null, '', location.pathname + location.search);
  },

  cache() {
    try {
      localStorage.setItem('kashik-day-' + this.date, JSON.stringify(this.day));
      localStorage.setItem('kashik-days', JSON.stringify(this.days));
    } catch (e) { /* нет места или запрещено */ }
  },

  // changes: {"tasks.t2": true, "glasses": 3}
  set(changes) {
    for (const [k, v] of Object.entries(changes)) {
      const [a, b] = k.split('.');
      if (b) this.day[a] = { ...(this.day[a] || {}), [b]: v }; else this.day[a] = v;
    }
    this.cache();
    APP.paint(false);
    if (this.key && DATA.api) {
      fetch(DATA.api + '/marks', {
        method: 'POST',
        headers: { 'X-Key': this.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: this.date, set: changes })
      }).catch(() => {});
    }
  },

  // Сегодня + прошлые дни недели и текущего круга тропы
  async pull() {
    if (!this.key || !DATA.api) return;
    const d = today();
    const monday = shift(d, -((d.getDay() + 6) % 7));
    const lap = shift(d, -(trail().day - 1));
    const from = iso(monday < lap ? monday : lap);
    try {
      const r = await fetch(`${DATA.api}/marks?from=${from}&to=${this.date}`, { headers: { 'X-Key': this.key }, cache: 'no-store' });
      if (!r.ok) return;
      const days = (await r.json()).days || {};
      this.day = days[this.date] || {};
      delete days[this.date];
      this.days = days;
      this.cache();
      APP.paint(false);
    } catch (e) { /* нет сети: остаёмся на копии */ }
  }
};

const marksOf = (date) => (date === STORE.date ? STORE.day : STORE.days[date] || {});

// Вода за день: «Пить воду» отмечается само, когда выпито 2/3 нормы
function waterOf(m) {
  const W = DATA.health.water;
  const goal = m.training ? W.goalTrainingMl : W.goalMl;
  const count = Math.round(goal / W.glassMl);
  const filled = Math.min(m.glasses || 0, count);
  const amount = filled * W.glassMl;
  return { ml: W.glassMl, goal, count, filled, amount, habitDone: amount * 3 >= goal * 2 };
}
const habitDoneIn = (m, x) => (x.auto ? waterOf(m).habitDone : !!(m.hab || {})[x.id]);
const habitsCount = (m) => DATA.health.habits.filter((x) => habitDoneIn(m, x)).length;
const meditatedIn = (m) => !!((m.hab || {}).med || (m.hab || {}).vip);

// Задачи дня приходят от Кэшика (miniapp-update → data.json): показываем, только если список сегодняшний
function dayTasks() {
  const list = DATA.tasksDate === STORE.date && Array.isArray(DATA.tasks) ? DATA.tasks : [];
  const main = list.find((t) => t.main) || list[0] || null;
  return { main, rest: list.filter((t) => t !== main) };
}
const taskDone = (t) => {
  const v = (STORE.day.tasks || {})[t.id];
  return v === undefined ? !!t.done : v;
};

// «Норма дня» на «Сегодня» собирается из «Здоровья», поэтому отметка в одном месте видна в другом
function norm() {
  const m = STORE.day;
  return {
    med: meditatedIn(m),
    vit: DATA.health.supplements.every((x) => (m.supp || {})[x.id]),
    water: waterOf(m).habitDone,
    train: !!(m.hab || {}).zar
  };
}
function toggleNorm(k) {
  const on = norm()[k];
  if (k === 'med') STORE.set(on ? { 'hab.med': false, 'hab.vip': false } : { 'hab.med': true });
  if (k === 'vit') STORE.set(Object.fromEntries(DATA.health.supplements.map((x) => ['supp.' + x.id, !on])));
  if (k === 'water') {
    const w = waterOf(STORE.day);
    STORE.set({ glasses: on ? 0 : Math.ceil(w.goal * 2 / 3 / w.ml) });
  }
  if (k === 'train') STORE.set({ 'hab.zar': !on });
}

// ---------- база экранов ----------
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(next) { this.state = next; APP.refresh(this); }
}

// ---------- «Сегодня» ----------
class TodayScreen extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#9E3F63';
    const aura = this.props.aura ?? '#E3A3BB';
    const ink = '#3B1F33';
    const muted = '#444F61';
    const soft = '#6B5563';
    const T = dayTasks();
    const L = lockIn();
    const d = today();

    const hour = new Date().getHours();
    const greet = hour < 5 ? ['Доброй', 'ночи,'] : hour < 12 ? ['Доброе', 'утро,'] : hour < 18 ? ['Добрый', 'день,'] : ['Добрый', 'вечер,'];

    const toggleTask = (t) => STORE.set({ ['tasks.' + t.id]: !taskDone(t) });
    const chipSm = `display:inline-flex;align-items:center;height:20px;padding:0 8px;box-sizing:border-box;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);font-size:11px;line-height:1;font-weight:600;color:${accent};`;

    const boxBase = 'display:flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;box-sizing:border-box;border-radius:13px;color:#FFFFFF;transition:background-color .2s ease-out;';
    const titleBase = 'display:block;margin-top:2px;font-size:16px;line-height:20px;font-weight:500;overflow-wrap:anywhere;text-wrap:pretty;';

    const tasks = T.rest.map((t) => {
      const on = taskDone(t);
      return {
        ...t,
        done: on,
        pressed: on ? 'true' : 'false',
        toggle: () => toggleTask(t),
        chipStyle: t.tag ? chipSm : 'display:none;',
        boxStyle: boxBase + (on
          ? `background:${accent};border:1.5px solid ${accent};`
          : 'background:rgba(255,255,255,.6);border:1.5px solid rgba(59,31,51,.42);'),
        titleStyle: titleBase + (on
          ? `color:${soft};text-decoration:line-through;text-decoration-color:rgba(107,85,99,.7);`
          : `color:${ink};`)
      };
    });
    const doneCount = tasks.filter((t) => t.done).length;

    // Фазы Lock In: прошедшие залиты, текущая — на phaseProgress, будущие пустые
    const phases = L.phases.map((name, i) => {
      const cur = i === L.phase;
      const fill = i < L.phase ? 100 : cur ? L.phaseProgress : 0;
      return {
        wrapStyle: `flex:${cur ? 1.4 : 1};min-width:0;`,
        aria: `${name}${cur ? ', текущая фаза' : ''}, пройдено ${fill}%`,

      mainTime: M ? M.time : '',
      mainTitle: M ? M.title : 'Задач пока нет',
      hasMain: !!M,
      noMain: !M,

      tasks,
      noTasks: tasks.length === 0,
      othersCount: `${doneCount} из ${tasks.length}`,

      chipStyle: M && M.tag ? `display:inline-flex;align-items:center;height:26px;padding:0 12px;box-sizing:border-box;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);font-size:12px;font-weight:600;color:${accent};` : 'display:none;',
      timeStyle: `margin-top:16px;min-height:20px;font-size:15px;line-height:20px;font-weight:600;color:${accent};font-variant-numeric:tabular-nums;`,
      mainTitleStyle: 'margin:4px 0 0;max-width:260px;font-size:24px;line-height:28px;font-weight:700;letter-spacing:-0.02em;overflow-wrap:anywhere;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;' + (md
        ? `color:${soft};text-decoration:line-through;text-decoration-color:rgba(107,85,99,.7);`
        : `color:${ink};`),
      mainPressed: md ? 'true' : 'false',

        ? `background:${ink};border:1px solid ${ink};color:#F8F4F1;box-shadow:0 12px 24px -12px rgba(59,31,51,.55);`
        : 'background:linear-gradient(120deg,#EFA9C3 0%,#C9B3EC 100%);border:1px solid rgba(255,255,255,.8);color:#2E1828;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 12px 26px -12px rgba(158,63,99,.55);'),
      toggleMain: () => M && toggleTask(M),

      badgeStyle: `position:absolute;top:-2px;right:-2px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:9px;background:${accent};color:#FFFFFF;border:1.5px solid #FFFFFF;box-sizing:border-box;`,

      medDone: !!nm.med, medPressed: nm.med ? 'true' : 'false', medCircle: circle(nm.med), medLabel: label(nm.med), toggleMed: () => toggleNorm('med'),
      vitDone: !!nm.vit, vitPressed: nm.vit ? 'true' : 'false', vitCircle: circle(nm.vit), vitLabel: label(nm.vit), toggleVit: () => toggleNorm('vit'),
      waterDone: !!nm.water, waterPressed: nm.water ? 'true' : 'false', waterCircle: circle(nm.water), waterLabel: label(nm.water), toggleWater: () => toggleNorm('water'),
      trainDone: !!nm.train, trainPressed: nm.train ? 'true' : 'false', trainCircle: circle(nm.train), trainLabel: label(nm.train), toggleTrain: () => toggleNorm('train'),

      navActiveStyle: `display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;padding:0;border:0;border-radius:26px;background:rgba(255,255,255,.82);box-shadow:inset 0 1px 0 #FFFFFF,0 6px 14px -8px rgba(110,52,84,.35);font-family:inherit;font-size:11px;line-height:13px;font-weight:700;color:${accent};cursor:pointer;`
    };
  }
}

// ---------- «Практики» ----------
class PracticesScreen extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: DATA.practices.selected || 'breath', playing: false, slide: 0 };
    this.player = null;
  }
  stopAudio() {
    if (this.player) this.player.pause();
  }
  renderVals() {
    const accent = this.props.accent ?? '#9E3F63';
    const aura = this.props.aura ?? '#E3A3BB';
    const s = this.state;
    const ink = '#3B1F33';
    const PR = DATA.practices;
    const tr = trail();
    const med = tr.med;

    const P = {
      morning: { title: 'Утренняя медитация', dur: `${med.min}′`, audio: med.audio },
      vipassana: { title: PR.vipassana.title, dur: `${PR.vipassana.min}′`, audio: PR.vipassana.audio },
      breath: { title: PR.breath.title, dur: `${PR.breath.min}′`, audio: PR.breath.audio }
    };
    const now = P[s.sel];
    const select = (k) => {
      if (s.sel !== k) this.stopAudio();
      this.setState({ ...s, sel: k, playing: s.sel === k ? s.playing : false });
    };
    // Если у практики есть ссылка на mp3, кнопка её играет; без ссылки меняется только вид плеера.
    // Дослушала до конца — привычка на «Здоровье» отмечается сама
    const HABIT_OF = { morning: 'med', vipassana: 'vip', breath: 'viz' };
    const togglePlay = () => {
      const playing = !s.playing;
      if (now.audio) {
        if (!this.player || this.player.dataset.src !== now.audio) {
          this.stopAudio();
          const habit = HABIT_OF[s.sel];
          this.player = new Audio(now.audio);
          this.player.dataset.src = now.audio;
          this.player.onended = () => {
            this.state = { ...this.state, playing: false };
            STORE.set({ ['hab.' + habit]: true });
          };
        }
        if (playing) this.player.play().catch(() => {}); else this.player.pause();
      }
      this.setState({ ...s, playing });
    };

    const ringOn = `box-shadow:0 0 0 2px ${accent},inset 0 1px 0 rgba(255,255,255,.85),0 22px 38px -22px rgba(150,80,60,.45);`;
    const ringOff = 'box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 18px 36px -24px rgba(150,80,60,.35);';
    const card = (bg, h, pad, on) => `position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-sizing:border-box;width:100%;height:${h}px;padding:${pad}px;border-radius:28px;border:1px solid rgba(255,255,255,.8);background:${bg};-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);text-align:left;font-family:inherit;color:${ink};cursor:pointer;` + (on ? ringOn : ringOff);

    const heights = [10, 16, 22, 14, 26, 30, 18, 12, 24, 28, 20, 14, 22, 30, 16, 10, 18, 24, 14, 8];
    const played = s.playing ? 8 : 0;
    const bars = heights.map((h, i) => ({
      style: `display:block;flex:none;width:2px;height:${h}px;border-radius:1px;background:${i < played ? accent : 'rgba(59,31,51,.3)'};animation-delay:${(i % 6) * 110}ms;`
    }));

    const SL = PR.visualizations;
    const n = SL.length;
    const slide = Math.min(s.slide, n - 1);
    const slides = SL.map((x, i) => ({
      src: x.image,
      alt: x.alt,
      imgStyle: `position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;opacity:${i === slide ? 1 : 0};transform:scale(${i === slide ? 1 : 1.04});transition:opacity .45s ease-out,transform .7s ease-out;`
    }));
    const dots = SL.map((_, i) => ({
      style: i === slide
        ? `display:block;width:20px;height:6px;border-radius:3px;background:${accent};transition:width .2s ease-out;`
        : 'display:block;width:6px;height:6px;border-radius:3px;background:rgba(59,31,51,.3);transition:width .2s ease-out;'
    }));

    return {
      accent,
      aura,
      subtitle: PR.subtitle,
      quoteBig: PR.quote.big,
      quoteSmall: PR.quote.small,

      medMonth: `день ${tr.day} из ${tr.length} · №${tr.medIdx + 1}`,
      medDur: `${med.min}′`,
      medName: med.title,
      medSteps: DATA.trail.meditations.map((_, i) => ({
        style: `display:block;flex:1;height:4px;border-radius:2px;background:${i === tr.medIdx ? accent : i < tr.medIdx ? 'rgba(158,63,99,.45)' : 'rgba(59,31,51,.16)'};`
      })),

      slides,
      scene: SL[slide].scene,
      bridge: SL[slide].bridge,
      slideLabel: `${slide + 1} из ${n}`,
      slideAria: `Картинка ${slide + 1} из ${n}`,
      dots,
      nextSlide: () => this.setState({ ...s, slide: (slide + 1) % n }),
      bridgeStyle: `margin:10px 0 0;font-size:14px;line-height:20px;font-weight:600;color:${accent};text-wrap:pretty;`,

      nowTitle: now.title,
      nowMeta: s.sel === 'morning' ? `№${tr.medIdx + 1} · ${now.dur}${s.playing ? ' · звучит' : ''}` : s.playing ? `${now.dur} · звучит` : `${now.dur} тишины`,
      isPlaying: !!s.playing,
      isPaused: !s.playing,
      playPressed: s.playing ? 'true' : 'false',
      playLabel: s.playing ? `Пауза: ${now.title}` : `Включить: ${now.title}`,
      togglePlay,
      waveClass: s.playing ? 'k-wave is-playing' : 'k-wave',
      bars,

      vipTitle: PR.vipassana.title,
      vipDur: P.vipassana.dur,
      breathTitle: PR.breath.title,
      breathDur: P.breath.dur,
      isMorning: s.sel === 'morning',
      isVipassana: s.sel === 'vipassana',
      notVipassana: s.sel !== 'vipassana',
      isBreath: s.sel === 'breath',
      notBreath: s.sel !== 'breath',
      morningPressed: s.sel === 'morning' ? 'true' : 'false',
      vipassanaPressed: s.sel === 'vipassana' ? 'true' : 'false',
      breathPressed: s.sel === 'breath' ? 'true' : 'false',
      selMorning: () => select('morning'),
      selVipassana: () => select('vipassana'),
      selBreath: () => select('breath'),
      morningStyle: card('linear-gradient(165deg,rgba(255,238,218,.82) 0%,rgba(247,206,170,.66) 100%)', 264, 16, s.sel === 'morning').replace('width:100%;', 'width:169px;flex:none;'),
      vipassanaStyle: card('linear-gradient(165deg,rgba(236,224,248,.8) 0%,rgba(240,200,218,.64) 100%)', 126, 16, s.sel === 'vipassana'),
      breathStyle: card('linear-gradient(165deg,rgba(255,230,218,.82) 0%,rgba(243,186,200,.64) 100%)', 126, 16, s.sel === 'breath'),
      inPlayerStyle: `display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;box-sizing:border-box;border-radius:999px;background:rgba(255,255,255,.78);font-size:11px;line-height:1;font-weight:700;color:${accent};white-space:nowrap;`,

      navActiveStyle: `display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;padding:0;border:0;border-radius:26px;background:rgba(255,255,255,.82);box-shadow:inset 0 1px 0 #FFFFFF,0 6px 14px -8px rgba(110,52,84,.35);font-family:inherit;font-size:11px;line-height:13px;font-weight:700;color:${accent};cursor:pointer;`
    };
  }
}

// ---------- «Здоровье» ----------
class HealthScreen extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#55642F';
    const aura = this.props.aura ?? '#C9D6A8';
    const m = STORE.day;
    const s = { training: !!m.training, supp: m.supp || {}, hab: m.hab || {} };
    const ink = '#2C3220';
    const muted = '#525940';
    const H = DATA.health;

    const { ml: ML, goal, count, filled, amount, habitDone: waterHabitDone } = waterOf(m);
    const p = Math.min(1, amount / goal);
    const pct = Math.round(p * 100);
    const waterTop = Math.round(4 + 200 * (1 - p) - 6);
    const reached = amount >= goal;
    const dense = count > 6;

    const glasses = Array.from({ length: count }, (_, i) => {
      const on = i < filled;
      return {
        label: `${ML} мл`,
        aria: `Стакан ${i + 1}, ${ML} мл, ${on ? 'выпит' : 'не выпит'}`,
        pressed: on ? 'true' : 'false',
        toggle: () => STORE.set({ glasses: (i + 1 === filled) ? i : i + 1 }),
        iconStyle: `display:block;flex:none;color:${on ? accent : muted};`,
        fillStyle: `opacity:${on ? 1 : 0};transition:opacity .25s ease-out;`,
        style: `display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;min-height:44px;padding:0 6px;box-sizing:border-box;border-radius:${dense ? 16 : 20}px;border:1px solid rgba(255,255,255,${on ? '.95' : '.75'});background:${on ? 'linear-gradient(160deg,rgba(220,230,178,.95) 0%,rgba(194,209,150,.88) 100%)' : 'rgba(255,255,255,.42)'};box-shadow:${on ? 'inset 0 1px 0 rgba(255,255,255,.8),0 10px 18px -12px rgba(80,96,40,.45)' : 'inset 0 1px 0 rgba(255,255,255,.7)'};font-family:inherit;font-size:13px;line-height:16px;font-weight:600;color:${on ? ink : muted};font-variant-numeric:tabular-nums;cursor:pointer;`
      };
    });

    const supps = H.supplements.map((x, i) => {
      const done = !!s.supp[x.id];
      return {
        title: x.title,
        time: x.time,
        icon: ICONS[x.icon] || ICONS.capsule,
        done,
        note: done ? `выпито · ${x.note}` : x.note,
        pressed: done ? 'true' : 'false',
        toggle: () => STORE.set({ ['supp.' + x.id]: !done }),
        rowStyle: `display:flex;align-items:center;gap:12px;width:100%;height:72px;padding:0;box-sizing:border-box;border:0;${i ? 'border-top:1px solid rgba(44,50,32,.08);' : ''}background:none;text-align:left;font-family:inherit;color:${ink};cursor:pointer;`,
        circleStyle: done
          ? `display:flex;flex:none;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border-radius:22px;background:${accent};color:#FFFFFF;box-shadow:0 8px 16px -8px rgba(70,84,36,.55);transition:background-color .2s ease-out;`
          : `display:flex;flex:none;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border-radius:22px;background:rgba(255,255,255,.7);border:1px solid rgba(85,100,47,.3);color:${accent};transition:background-color .2s ease-out;`,
        iconShow: `display:${done ? 'none' : 'block'};`,
        checkShow: `display:${done ? 'block' : 'none'};`
      };
    });
    const suppDone = supps.filter((x) => x.done).length;

    const habits = H.habits.map((x) => {
      const done = x.auto ? waterHabitDone : !!s.hab[x.id];
      return {
        title: x.title,
        icon: ICONS[x.icon] || ICONS.lotus,
        done,
        pressed: done ? 'true' : 'false',
        disabled: x.auto ? 'true' : 'false',
        toggle: x.auto ? () => {} : () => STORE.set({ ['hab.' + x.id]: !done }),
        tileStyle: `position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;width:100%;height:116px;padding:12px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(255,255,255,.8);background:${done ? 'linear-gradient(155deg,rgba(232,239,206,.92) 0%,rgba(216,227,180,.78) 100%)' : 'rgba(255,255,255,.42)'};box-shadow:${done ? 'inset 0 1px 0 rgba(255,255,255,.85),0 12px 24px -16px rgba(80,96,40,.4)' : 'inset 0 1px 0 rgba(255,255,255,.7)'};text-align:left;font-family:inherit;color:${ink};cursor:${x.auto ? 'default' : 'pointer'};`,
        iconWrap: `display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.75);color:${accent};`,
        autoStyle: x.auto
          ? `display:inline-flex;align-items:center;height:22px;padding:0 8px;box-sizing:border-box;border-radius:11px;background:rgba(255,255,255,.8);font-size:11px;line-height:1;font-weight:700;color:${accent};`
          : 'display:none;',
        badgeStyle: done
          ? `display:flex;align-items:center;justify-content:center;width:24px;height:24px;box-sizing:border-box;border-radius:12px;background:${accent};color:#FFFFFF;`
          : 'display:flex;align-items:center;justify-content:center;width:24px;height:24px;box-sizing:border-box;border-radius:12px;background:rgba(255,255,255,.55);border:1.5px solid rgba(82,89,64,.45);',
        checkShow: `display:${done ? 'block' : 'none'};`
      };
    });
    const habDone = habits.filter((x) => x.done).length;
    const segments = habits.map((x) => ({
      style: `display:block;flex:1;height:6px;border-radius:3px;background:${x.done ? accent : 'rgba(44,50,32,.1)'};transition:background-color .25s ease-out;`
    }));

    return {
      accent,
      aura,

      glassMeta: `${filled} из ${count} стаканов`,
      amountStr: String(amount),
      goalStr: `${goal} мл`,
      leftLabel: reached ? 'норма закрыта' : `ещё ${goal - amount} мл`,
      leftChipStyle: reached
        ? `display:inline-flex;align-items:center;height:30px;padding:0 10px;flex:none;box-sizing:border-box;border-radius:15px;background:${accent};font-size:12px;font-weight:700;color:#FFFFFF;font-variant-numeric:tabular-nums;white-space:nowrap;`
        : `display:inline-flex;align-items:center;height:30px;padding:0 10px;flex:none;box-sizing:border-box;border-radius:15px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);font-size:12px;font-weight:700;color:${accent};font-variant-numeric:tabular-nums;white-space:nowrap;`,
      pctStr: `${pct}%`,
      flaskAria: `Выпито ${amount} из ${goal} мл, ${pct}% нормы`,
      waterStyle: `transform:translateY(${waterTop}px);transition:transform .8s cubic-bezier(.22,1,.36,1);`,
      glassGridStyle: `display:grid;flex:1;min-width:0;height:208px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(${Math.ceil(count / 2)},1fr);gap:${dense ? 6 : 8}px;`,
      glasses,

      trainChecked: s.training ? 'true' : 'false',
      trainSub: s.training ? `норма выросла до ${H.water.goalTrainingMl} мл` : `норма вырастет до ${H.water.goalTrainingMl} мл`,
      toggleTraining: () => {
        const t = !s.training;
        const c = Math.round((t ? H.water.goalTrainingMl : H.water.goalMl) / ML);
        STORE.set({ training: t, glasses: Math.min(m.glasses || 0, c) });
      },
      trackStyle: `position:relative;display:block;flex:none;width:48px;height:28px;border-radius:14px;background:${s.training ? accent : 'rgba(82,89,64,.42)'};transition:background-color .2s ease-out;`,
      knobStyle: `position:absolute;top:3px;left:${s.training ? 23 : 3}px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;box-shadow:0 2px 6px rgba(44,50,32,.25);transition:left .2s ease-out;`,

      countPillStyle: `display:inline-flex;align-items:center;height:22px;padding:0 10px;box-sizing:border-box;border-radius:11px;background:rgba(255,255,255,.72);font-size:13px;line-height:1;font-weight:700;color:${accent};font-variant-numeric:tabular-nums;`,
      supps,
      suppCount: `${suppDone} из ${supps.length}`,

      habits,
      segments,
      habCount: `${habDone} из ${habits.length}`,
      habAria: `Привычки: выполнено ${habDone} из ${habits.length}`,

      navActiveStyle: `display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;padding:0;border:0;border-radius:26px;background:rgba(255,255,255,.82);box-shadow:inset 0 1px 0 #FFFFFF,0 6px 14px -8px rgba(70,84,36,.35);font-family:inherit;font-size:11px;line-height:13px;font-weight:700;color:${accent};cursor:pointer;`
    };
  }
}

// ---------- «Стратегия» ----------
class StrategyScreen extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4F23A';
    const aura = this.props.aura ?? '#F6C4A0';
    const ink = '#141414';
    const muted = '#5E5E63';
    const total = DATA.health.habits.length;

    // Неделя Пн–Вс по отметкам: прошлые дни с сервера, сегодня — живое число с «Здоровья», будущие пустые
    const d = today();
    const TODAY = (d.getDay() + 6) % 7;
    const mon = new Date(d.getTime() - TODAY * DAY);
    const sun = new Date(mon.getTime() + 6 * DAY);
    const weekMarks = DAY_LABELS.map((_, i) => (i > TODAY ? null : marksOf(iso(shift(mon, i)))));
    const todayN = habitsCount(STORE.day);
    const WEEK = DAY_LABELS.map((label, i) => [label, weekMarks[i] ? habitsCount(weekMarks[i]) : null]);
    const passedWeek = weekMarks.filter(Boolean);

    // График: ширина 308, линия «все привычки» на y=36, ноль на y=126
    const W = 308;
    const col = W / 7;
    const step = 90 / total;
    const pts = WEEK.map(([, n], i) => ({ x: col * (i + 0.5), y: 36 + (total - (n ?? 0)) * step }));
    const f = (v) => v.toFixed(1);
    const last = TODAY;
    let linePath = `M${f(pts[0].x)} ${f(pts[0].y)}`;
    for (let i = 0; i < last; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, last)];
      const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: Math.min(Math.max(p1.y + (p2.y - p0.y) / 6, 36), 126) };
      const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: Math.min(Math.max(p2.y - (p3.y - p1.y) / 6, 36), 126) };
      linePath += ` C${f(c1.x)} ${f(c1.y)} ${f(c2.x)} ${f(c2.y)} ${f(p2.x)} ${f(p2.y)}`;
    }

    const points = WEEK.map(([label, n], i) => {
      const { x, y } = pts[i];
      const isToday = i === TODAY;
      const closed = n === total && !isToday;
      const size = closed ? 14 : 8;
      let style = `position:absolute;left:${f(x - size / 2)}px;top:${f(y - size / 2)}px;width:${size}px;height:${size}px;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;animation-delay:${700 + i * 90}ms;`;
      if (closed) style += `background:${accent};color:${ink};`;
      else if (isToday || n === null) style += 'display:none;';
      else style += `background:#FFFFFF;border:1.5px solid ${ink};`;
      return { style, checkShow: `display:${closed ? 'block' : 'none'};` };
    });

    const tx = pts[TODAY].x;
    const ty = pts[TODAY].y;
    const bd = 30;

    const dayLabels = WEEK.map(([label], i) => ({
      label,
      style: `flex:1;text-align:center;font-size:11px;line-height:14px;font-weight:${i === TODAY ? 600 : 500};color:${i === TODAY ? ink : muted};`
    }));

    // Сегодня засчитывается, как только отмечены все привычки
    const weekDots = WEEK.map(([, n]) => ({
      style: `display:block;width:5px;height:5px;border-radius:50%;background:${n === total ? '#FFFFFF' : 'rgba(255,255,255,.32)'};`
    }));
    const closedDays = WEEK.filter(([, n]) => n === total).length;
    const waterDays = passedWeek.filter((m) => waterOf(m).habitDone).length;
    const medSessions = passedWeek.reduce((n, m) => n + !!(m.hab || {}).med + !!(m.hab || {}).vip, 0);
    const workouts = passedWeek.filter((m) => (m.hab || {}).zar).length;

    // Тропа: день засчитан, если была медитация (утро или вечер); пропуск остаётся бледным, тропу не обнуляет
    const tr = trail();
    const lapStart = shift(d, -(tr.day - 1));
    const dots = Array.from({ length: tr.length }, (_, i) => {
      const n = i + 1;
      let st = 'display:block;width:10px;height:10px;border-radius:50%;';
      if (n > tr.day) st += 'background:rgba(255,255,255,.24);';
      else if (meditatedIn(marksOf(iso(shift(lapStart, i))))) st += `background:${accent};`;
      else if (n === tr.day) st += `background:transparent;box-shadow:inset 0 0 0 2px ${accent};`;
      else st += `background:${accent}4D;`;
      return { cls: n === tr.day ? 'k-pulse' : '', style: st };
    });

    const white = 'position:relative;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;padding:16px;border-radius:28px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #FFFFFF,0 14px 32px -22px rgba(40,40,55,.18);';
    const DAY_NAMES = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];

    return {
      accent,
      aura,
      glowPeach: `position:absolute;left:90px;top:-60px;width:420px;height:360px;border-radius:50%;background:radial-gradient(closest-side,${aura},rgba(246,196,160,0));filter:blur(36px);`,

      week: lockIn().week,
      weekRange: `${mon.getDate()} ${MONTHS_SHORT[mon.getMonth()]} – ${sun.getDate()} ${MONTHS_SHORT[sun.getMonth()]}`,
      habTotal: total,

      closedDays: String(closedDays),
      weekDots,
      waterDays: String(waterDays),
      waterDots: Array.from({ length: 7 }, (_, i) => ({ style: `display:block;width:5px;height:5px;border-radius:50%;background:${i < waterDays ? '#FFFFFF' : 'rgba(255,255,255,.32)'};` })),
      medCount: String(medSessions),
      zarCount: String(workouts),
      whiteTile: white + 'animation-delay:280ms;',
      whiteTile2: white + 'animation-delay:330ms;',

      chartCard: 'position:relative;box-sizing:border-box;margin-top:10px;padding:20px;border-radius:32px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #FFFFFF,0 14px 32px -22px rgba(40,40,55,.18);animation-delay:380ms;',
      linePath,
      points,
      todayTip: String(todayN),
      bubbleStyle: `position:absolute;left:${f(tx - bd / 2)}px;top:${f(ty - bd / 2)}px;width:${bd}px;height:${bd}px;border-radius:50%;background:${accent};font-size:12px;line-height:${bd}px;font-weight:600;color:${ink};text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 6px ${accent}47,0 0 22px 4px ${accent}8C;`,
      connStyle: `position:absolute;left:${f(tx - 0.5)}px;top:${f(ty + bd / 2)}px;width:1px;height:${f(Math.max(0, 132 - ty - bd / 2))}px;background:${ink};`,
      triStyle: `position:absolute;left:${f(tx - 5)}px;top:132px;width:10px;height:8px;display:block;line-height:0;`,
      dayLabels,
      chartAria: `Динамика недели, привычки из ${total}: ` + WEEK.map(([, n], i) => (i === TODAY ? `сегодня ${n}` : n === null ? null : `${DAY_NAMES[i]} ${n}`)).filter(Boolean).join(', ') + `. Закрыто дней: ${closedDays} из 7`,
      legendDone: `display:flex;flex:none;align-items:center;justify-content:center;width:14px;height:14px;border-radius:7px;background:${accent};color:${ink};`,

      trailCount: `${tr.day} / ${tr.length}`,
      trailAria: `Тропа медитаций: день ${tr.day} из ${tr.length}`,
      dots
    };
  }
}

// ---------- мини-рендер шаблонов ----------
const HOLE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
const HOLES = /\{\{\s*([\w.$]+)\s*\}\}/g;
const lookup = (scope, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);

function fill(parent, scope, handlers) {
  for (const node of [...parent.childNodes]) {
    if (node.nodeType === 3) {
      if (node.nodeValue.includes('{{')) {
        node.nodeValue = node.nodeValue.replace(HOLES, (_, p) => { const v = lookup(scope, p); return v == null ? '' : String(v); });
      }
      continue;
    }
    if (node.nodeType !== 1) continue;
    const tag = node.localName;
    if (tag === 'sc-for' || tag === 'sc-if') {
      const out = document.createDocumentFragment();
      if (tag === 'sc-for') {
        const list = lookup(scope, node.getAttribute('list').match(HOLE)[1]) || [];
        const as = node.getAttribute('as');
        for (const item of list) {
          const part = document.createDocumentFragment();
          for (const c of node.childNodes) part.appendChild(c.cloneNode(true));
          fill(part, { ...scope, [as]: item }, handlers);
          out.appendChild(part);
        }
      } else if (lookup(scope, node.getAttribute('value').match(HOLE)[1])) {
        for (const c of node.childNodes) out.appendChild(c.cloneNode(true));
        fill(out, scope, handlers);
      }
      node.replaceWith(out);
      continue;
    }
    for (const a of [...node.attributes]) {
      const m = a.value.match(HOLE);
      if (!m) continue;
      const v = lookup(scope, m[1]);
      if (a.name.startsWith('on')) {
        node.removeAttribute(a.name);
        if (typeof v === 'function') { node.setAttribute('data-h', handlers.length); handlers.push(v); }
      } else if (v == null || v === false) node.removeAttribute(a.name);
      else node.setAttribute(a.name, String(v));
    }
    fill(node, scope, handlers);
  }
}

// Обновляет готовый DOM по новому, не пересоздавая совпадающие узлы: анимации появления не повторяются
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  const ac = [...a.childNodes], bc = [...b.childNodes];
  if (ac.length !== bc.length) { a.replaceChildren(...bc); return; }
  for (let i = 0; i < ac.length; i++) morph(ac[i], bc[i]);
}

// ---------- приложение ----------
const SCREENS = { today: TodayScreen, health: HealthScreen, practices: PracticesScreen, strategy: StrategyScreen };
const PROPS = {
  today: { accent: '#9E3F63', aura: '#E3A3BB' },
  practices: { accent: '#9E3F63', aura: '#E3A3BB' },
  health: { accent: '#55642F', aura: '#C9D6A8' },
  strategy: { accent: '#D4F23A', aura: '#F6C4A0' }
};

const tg = window.Telegram && window.Telegram.WebApp;
const tgAt = (v) => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
function haptic() {
  try { if (tgAt('6.1')) tg.HapticFeedback.selectionChanged(); } catch (e) { /* вне Telegram */ }
}

const stage = document.getElementById('stage');
const scroller = document.getElementById('scroller');
const navslot = document.getElementById('navslot');

const APP = {
  screens: {},
  current: null,
  root: null,
  nav: null,
  handlers: [],

  start() {
    for (const id in SCREENS) this.screens[id] = new SCREENS[id](PROPS[id]);
    stage.addEventListener('click', (e) => {
      const go = e.target.closest('[data-go]');
      if (go) { haptic(); this.go(go.dataset.go); return; }
      const h = e.target.closest('[data-h]');
      const fn = h && this.handlers[+h.dataset.h];
      if (fn) { haptic(); fn(); }
    });
    window.addEventListener('hashchange', () => this.go(location.hash.slice(1)));
    this.go(location.hash.slice(1));
  },

  go(id) {
    if (!SCREENS[id]) id = 'today';
    if (id === this.current) { scroller.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (this.current === 'practices') { this.screens.practices.stopAudio(); }
    this.current = id;
    this.paint(true);
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  },

  refresh(screen) {
    if (this.screens[this.current] === screen) this.paint(false);
  },

  paint(fresh) {
    const id = this.current;
    if (!id) return;
    const vals = this.screens[id].renderVals();
    const handlers = [];
    const frag = document.getElementById('tpl-' + id).content.cloneNode(true);
    fill(frag, vals, handlers);
    const root = frag.firstElementChild;
    const nav = root.querySelector(':scope > nav');
    nav.remove();
    root.classList.add('screen-root');
    root.dataset.screen = id;
    this.handlers = handlers;
    if (fresh || !this.root) {
      stage.dataset.screen = id;
      navslot.dataset.screen = id;
      // Меню вынесено из экрана, чтобы стоять на месте при прокрутке, поэтому шрифт ему задаём сами
      navslot.style.fontFamily = root.style.fontFamily;
      navslot.style.webkitFontSmoothing = 'antialiased';
      scroller.replaceChildren(root);
      navslot.replaceChildren(nav);
      scroller.scrollTop = 0;
      this.root = root;
      this.nav = nav;
    } else {
      morph(this.root, root);
      morph(this.nav, nav);
    }
  }
};

// Экран нарисован под ширину 390: на телефоне вся сцена масштабируется под ширину экрана
function fit() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const k = w <= 520 ? w / 390 : 1;
  stage.style.transform = `translateX(-50%) scale(${k})`;
  stage.style.height = `${h / k}px`;
  document.documentElement.style.setProperty('--stage-h', `${h / k}px`);
}

async function boot() {
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch (e) {
    DATA = JSON.parse(document.getElementById('data-fallback').textContent);
  }
  if (tg) {
    tg.ready();
    tg.expand();
    if (tgAt('7.7')) tg.disableVerticalSwipes();
  }
  fit();
  window.addEventListener('resize', fit);
  STORE.init();
  APP.start();
  STORE.pull();
  // Вернулась в приложение: свежие отметки (вдруг Кэшик что-то зачеркнул), а после полуночи — новый день
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (iso(today()) !== STORE.date) location.reload(); else STORE.pull();
  });
}

boot();

</script>
